<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><title>xmeshd</title>
<style>
  body { margin:0; font:13px/1.45 monospace; background:#111317; color:#e2e8f0; display:flex; height:100vh; overflow:hidden; }
  aside { width:220px; min-width:140px; max-width:450px; background:#181b20; padding:12px; overflow-y:auto; flex-shrink:0; }
  aside .item { padding:5px 8px; cursor:pointer; border-radius:4px; margin-bottom:2px; display:flex; align-items:center; gap:6px; }
  aside .item.active, aside .item:hover { background:#2b6cb0; color:#fff; }
  aside .item.muted { opacity:.45; }
  aside .item .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  aside .item .nm.pub { font-weight:700; }
  aside .item.unread .nm { font-weight:700; }
  .badge { background:#e53e3e; color:#fff; border-radius:10px; padding:0 6px; font-size:11px; }
  .sec { color:#a0aec0; font-size:11px; letter-spacing:.04em; margin:10px 4px 4px; cursor:pointer; }
  #chFilter { width:100%; box-sizing:border-box; margin:6px 0; }
  #ctx { position:fixed; z-index:20; background:#1a202c; border:1px solid #4a5568; border-radius:6px; min-width:180px; padding:4px; box-shadow:0 8px 24px #0008; }
  #ctx button { display:block; width:100%; text-align:left; background:transparent; color:#e2e8f0; }
  #ctx button:hover { background:#2b6cb0; }
  #audit { display:none; position:fixed; right:16px; bottom:16px; width:420px; max-height:50vh; overflow:auto; background:#0d1117; border:1px solid #2d3748; padding:10px; z-index:15; }
  .resizer { width:4px; background:#2d3748; cursor:col-resize; flex-shrink:0; transition:background .15s; }
  .resizer:hover { background:#4299e1; }
  main { flex:1; display:flex; flex-direction:column; min-width:260px; }
  #log { flex:1; overflow-y:auto; padding:16px; white-space:pre-wrap; word-break:break-word; }
  .msg { margin-bottom:12px; padding:10px; background:#1a202c; border-left:3px solid #4299e1; }
  .bar { display:flex; gap:8px; padding:12px; background:#181b20; border-top:1px solid #2d3748; }
  textarea, input, select { background:#0d0f12; color:#fff; border:1px solid #2d3748; padding:6px; font:inherit; }
  textarea { flex:1; height:52px; resize:none; }
  button { background:#2b6cb0; color:#fff; border:0; padding:6px 10px; cursor:pointer; border-radius:3px; }
  button:disabled { background:#2d3748; color:#718096; cursor:not-allowed; }
  #panel { width:340px; min-width:240px; max-width:600px; background:#181b20; padding:12px; display:flex; flex-direction:column; gap:8px; flex-shrink:0; }
  #diffView { flex:1; overflow:auto; background:#0b0d10; border:1px solid #2d3748; padding:8px; font-size:12px; white-space:pre; }
  .d-add { background:#132e21; color:#68d391; display:block; } .d-del { background:#33181b; color:#fc8181; display:block; }
  .d-hunk { color:#63b3ed; font-weight:bold; display:block; } .d-file { color:#f6e05e; font-weight:bold; display:block; }
  .md pre { background:#0b0d10; border:1px solid #2d3748; padding:10px; border-radius:4px; overflow-x:auto; margin:8px 0; position:relative; }
  .md code.inline { background:#2d3748; padding:1px 5px; border-radius:3px; color:#fbd38d; }
  .md h1, .md h2, .md h3 { margin:10px 0 6px; color:#63b3ed; border-bottom:1px solid #2d3748; padding-bottom:2px; }
  .md table { border-collapse:collapse; margin:8px 0; width:100%; font-size:12px; }
  .md th, .md td { border:1px solid #2d3748; padding:5px 8px; text-align:left; }
  .md th { background:#2d3748; }
  .md blockquote { border-left:3px solid #718096; margin:6px 0; padding-left:10px; color:#a0aec0; }
  .code-hdr { display:flex; justify-content:space-between; font-size:11px; color:#a0aec0; border-bottom:1px solid #2d3748; padding-bottom:4px; margin-bottom:6px; }
</style>
</head>
<body>
<aside id="leftBar">
  <b data-i18n="channels">CHANNELS</b> <button style="padding:1px 6px;float:right" onclick="newChannel()">+</button>
  <input id="chFilter" placeholder="Filter" oninput="renderChannels()">
  <div id="chList"></div>
  <br><b data-i18n="threads">THREADS</b>
  <span style="float:right">
    <button style="padding:1px 6px" onclick="forkThread()">Fork</button>
    <button style="padding:1px 6px" onclick="newThread()">+</button>
  </span>
  <hr style="border-color:#2d3748"><div id="threadList"></div>
</aside>
<div class="resizer" id="resizerL"></div>
<main>
  <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#181b20;border-bottom:1px solid #2d3748;gap:8px">
    <div style="display:flex;align-items:center;gap:10px;min-width:0">
      <b id="headerTitle" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"># general / main</b>
      <span id="statusBadge" style="font-size:12px;color:#ecc94b;white-space:nowrap">● connecting...</span>
    </div>
    <div style="display:flex;gap:6px;flex-shrink:0">
      <select id="modelSelect"><option value="gemini-2.5-flash">gemini-2.5-flash</option><option value="gemini-2.5-pro">gemini-2.5-pro</option></select>
      <button id="bell" style="background:#4a5568" title="Desktop notifications need HTTPS or localhost" onclick="enableNotes()">Bell</button>
      <button style="background:#4a5568" onclick="toggleAudit()">Log</button>
      <select id="langSelect" onchange="setLang(this.value)"><option value="en">EN</option><option value="ru">RU</option></select>
    </div>
  </div>
  <div id="log"></div>
  <div style="background:#181b20;border-top:1px solid #2d3748;padding:8px 12px">
    <div id="attBar" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;font-size:12px"></div>
    <div class="bar" style="padding:0;border:0">
      <input type="file" id="fileInput" multiple style="display:none" onchange="handleFiles(this.files)">
      <button style="background:#4a5568" onclick="fileInput.click()" title="Attach images, PDF, logs, code">+ File</button>
      <textarea id="composer" data-i18n-ph="promptPh" onpaste="handlePaste(event)"></textarea>
      <button onclick="send()" data-i18n="send">Send</button>
    </div>
  </div>
</main>
<div class="resizer" id="resizerR"></div>
<div id="panel">
  <b data-i18n="memTitle">CONTEXT & MEMORY</b>
  <input id="mTitle" data-i18n-ph="keyPh">
  <textarea id="mText" style="flex:none;height:54px" data-i18n-ph="memPh"></textarea>
  <div style="display:flex;gap:6px"><button onclick="saveMem(true)" data-i18n="pinBtn">Pin Raw</button><button onclick="saveMem(false)" data-i18n="learnBtn">Distill Learn</button></div>
  <div id="memList" style="max-height:95px;overflow-y:auto;background:#0b0d10;border:1px solid #2d3748;padding:4px;font-size:12px"></div>
  <hr style="border-color:#2d3748;width:100%">
  <b data-i18n="deployTitle">DIFF INSPECTOR & DEPLOY</b>
  <input id="dNode" placeholder="Node gRPC URL (http://node.example:8443)" onchange="localStorage.dNode=this.value">
  <input id="dRepo" placeholder="Target workspace (/srv/projects/app)" onchange="localStorage.dRepo=this.value">
  <input id="dPipe" placeholder="Pipeline name (local.yaml)" onchange="localStorage.dPipe=this.value">
  <div style="display:flex;justify-content:space-between"><span id="diffStats" data-i18n="noDiff">No diff</span><button onclick="pasteDiff()" data-i18n="paste">Paste</button></div>
  <div id="diffView" data-i18n="awaitDiff">Awaiting diff...</div>
  <button id="btnApprove" style="background:#2f855a" disabled onclick="approveTask()" data-i18n="approve">Approve & Execute</button>
</div>
<div id="ctx" hidden></div>
<div id="audit"></div>
<script>
const I18N = {
  en: { channels:'CHANNELS', threads:'THREADS', send:'Send', promptPh:'Message to thread...', memTitle:'CONTEXT & MEMORY',
        keyPh:'Key (e.g. nft-rules)', memPh:'Invariant or thread notes...', pinBtn:'Pin Raw', learnBtn:'Distill Learn',
        deployTitle:'DIFF INSPECTOR & DEPLOY', noDiff:'No diff', paste:'Paste', awaitDiff:'Awaiting diff...',
        approve:'Approve & Execute', newCh:'New channel name:', newTh:'New thread name:', noMem:'No pinned entries', visPh:'Visibility: private or public' },
  ru: { channels:'КАНАЛЫ', threads:'ТРЕДЫ', send:'Отправить', promptPh:'Сообщение в тред...', memTitle:'КОНТЕКСТ И ПАМЯТЬ',
        keyPh:'Ключ (напр. nft-rules)', memPh:'Инвариант или заметка...', pinBtn:'Закрепить', learnBtn:'Сжать опыт',
        deployTitle:'ИНСПЕКТОР DIFF И ДЕПЛОЙ', noDiff:'Нет diff', paste:'Вставить', awaitDiff:'Ожидание патча...',
        approve:'Утвердить и выполнить', newCh:'Имя нового канала:', newTh:'Имя нового треда:', noMem:'Нет закрепленных записей', visPh:'Видимость: private или public' }
};
let lang = localStorage.lang || 'en', ch = 'general', thread = 'main', currentDiff = '', chMeta = {}, channelRows = [];
let showArchived = false, showClosed = false, ctxName = '';
function t(k) { return (I18N[lang] || I18N.en)[k] || k; }
function setLang(l) {
  lang = l; localStorage.lang = l;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
}
function initResize(bar, target, key, invert) {
  bar.onmousedown = () => {
    document.onmousemove = e => {
      const w = invert ? (window.innerWidth - e.clientX) : e.clientX;
      target.style.width = w + 'px'; localStorage[key] = w;
    };
    document.onmouseup = () => { document.onmousemove = null; };
  };
}
function channelOf(raw) {
  return typeof raw === 'string' ? { name: raw, visibility: 'public' } : raw;
}
function prefix(c) {
  if (c.group === 'general' || c.visibility === 'public') return '# ';
  if (c.visibility === 'shared') return '~ ';
  return '· ';
}
function renderChannels() {
  const q = (chFilter.value || '').trim().toLowerCase();
  chList.innerHTML = '';
  const groups = [
    ['', rows => rows.filter(c => c.group === 'general')],
    ['Channels', rows => rows.filter(c => c.group === 'public' && !c.archived && !c.closed)],
    ['Private', rows => rows.filter(c => c.group === 'private' && !c.archived && !c.closed)],
    ['Shared', rows => rows.filter(c => c.group === 'other' && !c.archived && !c.closed)],
  ];
  const draw = (title, rows) => {
    const shown = rows.filter(c => !q || c.name.toLowerCase().includes(q));
    if (!shown.length) return;
    if (title) {
      const h = document.createElement('div');
      h.className = 'sec';
      h.textContent = title;
      chList.appendChild(h);
    }
    shown.forEach(c => chList.appendChild(channelRow(c)));
  };
  groups.forEach(([title, pick]) => draw(title, pick(channelRows)));
  const arch = channelRows.filter(c => c.archived);
  const closed = channelRows.filter(c => c.closed && !c.archived);
  const fold = (title, rows, open, toggle) => {
    if (!rows.length) return;
    const h = document.createElement('div');
    h.className = 'sec';
    h.textContent = `${open ? '▾' : '▸'} ${title} (${rows.length})`;
    h.onclick = toggle;
    chList.appendChild(h);
    if (open) rows.filter(c => !q || c.name.toLowerCase().includes(q)).forEach(c => chList.appendChild(channelRow(c)));
  };
  fold('Archived', arch, showArchived, () => { showArchived = !showArchived; renderChannels(); });
  fold('Closed', closed, showClosed, () => { showClosed = !showClosed; renderChannels(); });
}
function channelRow(c) {
  const d = document.createElement('div');
  d.className = 'item' + (c.name === ch ? ' active' : '') + (c.muted ? ' muted' : '') + (!c.muted && c.unread_count > 0 ? ' unread' : '');
  const nm = document.createElement('span');
  nm.className = 'nm' + ((c.group === 'general' || c.visibility === 'public') ? ' pub' : '');
  nm.textContent = prefix(c) + c.name;
  d.appendChild(nm);
  if (!c.muted && c.unread_count > 0) {
    const b = document.createElement('span');
    b.className = 'badge';
    b.textContent = c.unread_count > 99 ? '99+' : String(c.unread_count);
    d.appendChild(b);
  }
  d.title = `${c.name} (${c.visibility || 'private'})\nread ${c.read_count || 0} · unread ${c.unread_count || 0}`;
  d.onclick = () => setCh(c.name);
  d.oncontextmenu = ev => openMenu(ev, c);
  return d;
}
function openMenu(ev, c) {
  ev.preventDefault();
  ctxName = c.name;
  const general = c.name === 'general';
  const items = [
    [c.pinned ? 'Unpin' : 'Pin', () => pref({pinned: !c.pinned})],
    [c.muted ? 'Unmute' : 'Mute', () => pref({muted: !c.muted})],
    ['Mark read', () => pref({mark_read: true})],
  ];
  if (!general) {
    items.push([c.archived ? 'Unarchive' : 'Archive', () => pref({archived: !c.archived})]);
    items.push([c.closed ? 'Reopen' : 'Close', () => pref({closed: !c.closed})]);
    if (c.visibility !== 'public') items.push(['Invite nodes…', () => shareChannel(c.name)]);
  }
  ctx.innerHTML = '';
  items.forEach(([label, fn]) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = () => { ctx.hidden = true; fn(); };
    ctx.appendChild(b);
  });
  ctx.hidden = false;
  ctx.style.left = Math.min(ev.clientX, window.innerWidth - 200) + 'px';
  ctx.style.top = Math.min(ev.clientY, window.innerHeight - 220) + 'px';
}
document.addEventListener('click', () => { ctx.hidden = true; });
async function pref(patch) {
  await fetch('/api/channel-state', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name: ctxName, ...patch}) });
  await refreshChannels();
}
async function shareChannel(name) {
  const raw = window.prompt('Invite node ids, comma separated');
  if (!raw) return;
  const members = raw.split(',').map(s => s.trim()).filter(Boolean);
  const r = await fetch('/api/share', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({channel:name, origin_node:'', members, messages:[], entries:[]}) });
  if (!r.ok) { window.alert('Share failed'); return; }
  await refreshChannels();
}
async function refreshChannels() {
  const list = (await (await fetch('/api/channels')).json()).map(channelOf);
  channelRows = list;
  chMeta = {};
  list.forEach(c => { chMeta[c.name] = c; });
  if (!chMeta[ch]) chMeta[ch] = { name: ch, visibility: 'private', group: 'private' };
  if (ctx.hidden) renderChannels();
}
async function refreshThreads() {
  const list = await (await fetch(`/api/threads?channel=${encodeURIComponent(ch)}`)).json(); threadList.innerHTML = '';
  list.forEach(th => {
    const d = document.createElement('div'); d.className = 'item' + (th === thread ? ' active' : '');
    d.textContent = `↳ ${th}`; d.title = th; d.onclick = () => { thread = th; refreshThreads(); loadHistory(); }; threadList.appendChild(d);
  });
}
async function refreshMemory() {
  const items = await (await fetch(`/api/memory?channel=${encodeURIComponent(ch)}`)).json();
  memList.innerHTML = items.length ? '' : `<span style="color:#718096">${t('noMem')}</span>`;
  items.forEach(it => {
    const r = document.createElement('div'); r.style.cssText = 'display:flex;justify-content:space-between;padding:2px 4px';
    const l = document.createElement('span'); l.style.cssText = 'cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
    l.textContent = `[${it.kind}] ${it.source_path.replace('memory/','')}`;
    l.onclick = () => { mTitle.value = it.source_path.replace('memory/',''); mText.value = it.content; appendBubble(it.kind, it.content); };
    const x = document.createElement('button'); x.textContent = 'x'; x.style.cssText = 'background:#9b2c2c;padding:0 5px';
    x.onclick = async () => { await fetch(`/api/memory?id=${encodeURIComponent(it.id)}`, {method:'DELETE'}); refreshMemory(); };
    r.append(l, x); memList.appendChild(r);
  });
}
async function setPresence(viewing) {
  await fetch('/api/presence', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({channel: ch, viewing}) });
}
async function setCh(c) {
  ch = c; thread = 'main';
  await setPresence(document.visibilityState === 'visible');
  await fetch('/api/channel-state', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name:c, mark_read:true, bump_use:true}) });
  await refreshChannels(); await refreshThreads(); await refreshMemory(); await loadHistory();
}
function notifyAway(channel, text) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  if (document.visibilityState === 'visible' && ch === channel) return;
  const body = (text || 'New reply').slice(0, 180);
  new Notification('#' + channel, { body });
}
async function enableNotes() {
  if (!window.isSecureContext) {
    window.alert('Notifications need a secure page. Open the https:// address and allow the certificate, or use localhost.');
    return;
  }
  if (!('Notification' in window)) return;
  await Notification.requestPermission();
}
async function toggleAudit() {
  if (audit.style.display === 'block') { audit.style.display = 'none'; return; }
  const rows = await (await fetch('/api/audit')).json();
  audit.innerHTML = '<b>Hub log</b><div style="color:#a0aec0;margin:4px 0 8px">Public and shared activity stored on the hub.</div>' +
    (rows || []).map(r => `<div style="margin-bottom:6px"><b>${escHtml(r.action)}</b> ${escHtml(r.node_id)} · ${escHtml(r.channel)}<br><span style="color:#a0aec0">${escHtml((r.detail || '').slice(0, 220))}</span></div>`).join('');
  audit.style.display = 'block';
}
document.addEventListener('visibilitychange', () => { setPresence(document.visibilityState === 'visible'); });
async function newChannel() {
  const n = window.prompt(t('newCh')); if (!n) return;
  const vis = (window.prompt(t('visPh'), 'private') || 'private').trim().toLowerCase();
  const name = n.trim().replace(/\s+/g, '-');
  await fetch('/api/channels', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, visibility: vis === 'public' ? 'public' : 'private', namespace: name })
  });
  await setCh(name);
}
async function newThread() { const n = window.prompt(t('newTh')); if (n) { thread = n.trim().replace(/\s+/g, '-'); await refreshThreads(); loadHistory(); } }
async function forkThread() {
  const dst = window.prompt('Fork to:'); if (!dst) return;
  const [h, tl] = (window.prompt('head,tail:', '2,6') || '2,6').split(',').map(x => parseInt(x, 10) || 0);
  await fetch('/api/threads/fork', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({channel:ch, src_thread:thread, dst_thread:dst.trim(), keep_head:h, keep_tail:tl}) });
  thread = dst.trim(); await refreshThreads(); await loadHistory();
}
async function loadHistory() {
  const vis = (chMeta[ch] && chMeta[ch].visibility) || '';
  headerTitle.textContent = `# ${ch} / ${thread}${vis ? ' · ' + vis : ''}`; log.innerHTML = '';
  (await (await fetch(`/api/history?channel=${encodeURIComponent(ch)}&thread=${encodeURIComponent(thread)}`)).json()).forEach(m => appendBubble(m.role, m.text));
}

function escHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderMarkdown(raw) {
  const blocks = [];
  let txt = raw.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (_, fenceLang, code) => {
    const id = blocks.length;
    const clean = code.replace(/\n$/, '');
    const b64 = btoa(unescape(encodeURIComponent(clean)));
    blocks.push(
      `<pre><div class="code-hdr"><span>${escHtml(fenceLang || 'text')}</span>` +
      `<button style="padding:1px 6px;font-size:11px" onclick="navigator.clipboard.writeText(decodeURIComponent(escape(atob('${b64}'))))">Copy</button></div>` +
      `<code>${escHtml(clean)}</code></pre>`
    );
    return `\x00BLK${id}\x00`;
  });

  txt = escHtml(txt);

  txt = txt.replace(/((?:^\|.+\|\n?)+)/gm, tbl => {
    const rows = tbl.trim().split('\n').filter(r => !/^\|[\s:-]+\|$/.test(r.trim()));
    const htmlRows = rows.map((r, i) => {
      const tag = i === 0 ? 'th' : 'td';
      const cells = r.trim().replace(/^\||\|$/g, '').split('|').map(c => `<${tag}>${c.trim()}</${tag}>`).join('');
      return `<tr>${cells}</tr>`;
    }).join('');
    return `<table>${htmlRows}</table>`;
  });

  txt = txt
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>')
    .replace(/`([^`\n]+)`/g, '<code class="inline">$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\*([^*]+)\*/g, '<i>$1</i>');

  return txt.replace(/\x00BLK(\d+)\x00/g, (_, i) => blocks[Number(i)]);
}

function appendBubble(who, txt) {
  const box = document.createElement('div');
  box.className = 'msg md';
  const hdr = document.createElement('div');
  hdr.style.cssText = 'font-weight:bold;color:#63b3ed;margin-bottom:4px';
  hdr.textContent = `[${who}]`;
  box.appendChild(hdr);

  const body = document.createElement('div');
  body.innerHTML = renderMarkdown(txt);
  box.appendChild(body);

  // Перехватываем сырой diff для правой панели инспектора
  const m = txt.match(/```diff\n([\s\S]*?)```/);
  if (m) {
    const b = document.createElement('button');
    b.style.marginTop = '8px';
    b.textContent = 'Inspect Diff ->';
    b.onclick = () => loadDiff(m[1]);
    box.appendChild(b);
  }
  log.appendChild(box);
  log.scrollTop = log.scrollHeight;
}

let pendingAtts = [];

function renderAtts() {
  attBar.innerHTML = '';
  pendingAtts.forEach((a, idx) => {
    const tag = document.createElement('span');
    tag.style.cssText = 'background:#2d3748;padding:2px 8px;border-radius:3px';
    tag.textContent = `📎 ${a.name} `;
    const x = document.createElement('b'); x.textContent = '×'; x.style.cursor = 'pointer';
    x.onclick = () => { pendingAtts.splice(idx, 1); renderAtts(); };
    tag.appendChild(x); attBar.appendChild(tag);
  });
}

function handleFiles(files) {
  Array.from(files).forEach(f => {
    const reader = new FileReader();
    reader.onload = () => {
      const b64 = reader.result.split(',')[1];
      pendingAtts.push({ name: f.name, mime_type: f.type || 'text/plain', data_base64: b64 });
      renderAtts();
    };
    reader.readAsDataURL(f);
  });
  fileInput.value = '';
}

function handlePaste(e) {
  const items = (e.clipboardData || {}).items || [];
  const files = Array.from(items).filter(i => i.kind === 'file').map(i => i.getAsFile()).filter(Boolean);
  if (files.length) handleFiles(files);
}

function attachDiffButton(container, txt) {
  const m = txt.match(/```diff\n([\s\S]*?)```/);
  if (!m || container.querySelector('.inspect-diff')) return;
  const b = document.createElement('button');
  b.className = 'inspect-diff';
  b.style.marginTop = '8px';
  b.textContent = 'Inspect Diff ->';
  b.onclick = () => loadDiff(m[1]);
  container.appendChild(b);
}
async function send() {
  const box = document.getElementById('composer');
  const p = box.value.trim();
  if (!p && !pendingAtts.length) return;
  const atts = pendingAtts; pendingAtts = []; renderAtts();
  box.value = '';
  appendBubble('user', p + (atts.length ? `\n[Attached: ${atts.map(a=>a.name).join(', ')}]` : ''));

  // Создаем живую карточку ответа со статусом и блоком thinking
  const card = document.createElement('div'); card.className = 'msg md';
  const hdr = document.createElement('div'); hdr.style.cssText = 'font-weight:bold;color:#63b3ed;margin-bottom:4px';
  hdr.textContent = `[${modelSelect.value}]`;
  const statusLine = document.createElement('div'); statusLine.style.cssText = 'color:#ecc94b;font-size:12px;margin-bottom:6px';
  statusLine.textContent = '⏳ Awaiting response...';
  const thoughtBox = document.createElement('details'); thoughtBox.style.cssText = 'display:none;background:#0d0f12;padding:6px;margin-bottom:8px;border-left:2px solid #805ad5;font-size:12px;color:#cbd5e0';
  thoughtBox.innerHTML = '<summary style="cursor:pointer;color:#b794f4">💭 Thinking...</summary><pre style="white-space:pre-wrap;margin:4px 0 0"></pre>';
  const body = document.createElement('div');
  card.append(hdr, statusLine, thoughtBox, body);
  log.appendChild(card); log.scrollTop = log.scrollHeight;

  const sentOn = ch;
  const resp = await fetch('/api/chat', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ channel: sentOn, thread, prompt: p || 'Analyze attached files', model: modelSelect.value, attachments: atts })
  });
  if (!resp.ok || !resp.body) {
    statusLine.style.display = 'none';
    body.textContent = await resp.text();
    return;
  }

  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '', fullText = '', thoughtText = '';

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n\n')) >= 0) {
      const chunk = buf.slice(0, idx).trim();
      buf = buf.slice(idx + 2);
      if (!chunk.startsWith('data:')) continue;
      const ev = JSON.parse(chunk.slice(5).trim());
      if (ev.type === 'status') { statusLine.textContent = `⏳ ${ev.text}`; }
      else if (ev.type === 'thought') {
        thoughtBox.style.display = 'block';
        thoughtText += ev.text;
        thoughtBox.querySelector('pre').textContent = thoughtText;
      } else if (ev.type === 'delta') {
        statusLine.style.display = 'none';
        fullText += ev.text;
        body.innerHTML = renderMarkdown(fullText);
      } else if (ev.type === 'done') {
        hdr.textContent = `[${ev.model_used}]`;
        statusLine.style.display = 'none';
        attachDiffButton(card, fullText);
        if (ch !== sentOn || document.visibilityState !== 'visible') notifyAway(sentOn, fullText);
        refreshChannels();
      }
      log.scrollTop = log.scrollHeight;
    }
  }
  await refreshThreads();
}

function loadDiff(raw) {
  currentDiff = raw; diffView.innerHTML = ''; let a = 0, d = 0;
  raw.split('\n').forEach(l => {
    const s = document.createElement('span'); s.textContent = l || ' ';
    if (l.startsWith('+++')||l.startsWith('---')) s.className='d-file'; else if (l.startsWith('@@')) s.className='d-hunk';
    else if (l.startsWith('+')) { s.className='d-add'; a++; } else if (l.startsWith('-')) { s.className='d-del'; d++; }
    diffView.appendChild(s);
  });
  diffStats.textContent = `+${a} / -${d}`; btnApprove.disabled = false;
}
function pasteDiff() { const r = window.prompt('Diff:'); if (r) loadDiff(r); }
async function saveMem(pin) {
  await fetch('/api/memory/learn', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({channel:ch, title:mTitle.value, text:mText.value, pin}) });
  await refreshMemory();
}
async function approveTask() {
  btnApprove.disabled = true;
  const r = await (await fetch('/api/task/approve', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({node_grpc_url:dNode.value, target_repo:dRepo.value, deploy_pipeline:dPipe.value, unified_diff:currentDiff}) })).json();
  appendBubble('deploy', JSON.stringify(r, null, 2));
}
window.onload = async () => {
  if (localStorage.wLeft) leftBar.style.width = localStorage.wLeft + 'px';
  if (localStorage.wRight) panel.style.width = localStorage.wRight + 'px';
  initResize(resizerL, leftBar, 'wLeft', false); initResize(resizerR, panel, 'wRight', true);
  dNode.value = localStorage.dNode || ''; dRepo.value = localStorage.dRepo || ''; dPipe.value = localStorage.dPipe || '';
  langSelect.value = lang; setLang(lang);
  const cfg = await (await fetch('/api/config')).json();
  if (cfg.models && cfg.models.length) {
    modelSelect.innerHTML = '';
    cfg.models.forEach(m => {
      const opt = document.createElement('option');
      if (typeof m === 'string') { opt.value = m; opt.textContent = m; }
      else { opt.value = m.id; opt.textContent = m.label || `${m.model} : ${m.host || m.provider}`; }
      modelSelect.appendChild(opt);
    });
  }
  if (cfg.default_model) modelSelect.value = cfg.default_model;
  document.getElementById('composer').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    else if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); send(); }
  });
  await setCh('general');
};
const spin = ['⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏']; let si = 0, lastDone = -1;
setInterval(async () => {
  try {
    const s = await (await fetch('/api/status')).json();
    if (s.busy) {
      statusBadge.style.color = '#ecc94b';
      statusBadge.textContent = `${spin[si++%spin.length]} ${s.done_repos}/${s.total_repos}: ${s.current_repo} (${s.indexed_files})`;
      refreshChannels();
    } else {
      const embed = s.embeddings ? '' : ' · lexical';
      statusBadge.style.color = '#68d391';
      statusBadge.textContent = `● ready${s.mode ? ' ' + s.mode : ''} (${s.total_repos || 0})${embed}`;
      refreshChannels();
    }
  } catch { statusBadge.style.color = '#fc8181'; statusBadge.textContent = '● offline'; }
}, 2000);
</script>
