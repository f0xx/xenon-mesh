<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><title>xmeshd lab</title>
<style>
  body { margin:0; font:13px/1.45 monospace; background:#111317; color:#e2e8f0; display:flex; height:100vh; }
  aside { width:200px; background:#181b20; border-right:1px solid #2d3748; padding:12px; overflow-y:auto; }
  aside .item { padding:5px 8px; cursor:pointer; border-radius:4px; margin-bottom:2px; }
  aside .item.active, aside .item:hover { background:#2b6cb0; color:#fff; }
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #log { flex:1; overflow-y:auto; padding:16px; white-space:pre-wrap; }
  .msg { margin-bottom:12px; padding:10px; background:#1a202c; border-left:3px solid #4299e1; }
  .bar { display:flex; gap:8px; padding:12px; background:#181b20; border-top:1px solid #2d3748; }
  textarea, input { background:#0d0f12; color:#fff; border:1px solid #2d3748; padding:7px; font:inherit; }
  textarea { flex:1; height:52px; resize:none; }
  button { background:#2b6cb0; color:#fff; border:0; padding:6px 10px; cursor:pointer; border-radius:3px; }
  button:disabled { background:#2d3748; color:#718096; cursor:not-allowed; }
  #panel { width:360px; background:#181b20; border-left:1px solid #2d3748; padding:12px; display:flex; flex-direction:column; gap:8px; }
  #diffView { flex:1; overflow:auto; background:#0b0d10; border:1px solid #2d3748; padding:8px; font-size:12px; white-space:pre; }
  .d-add { background:#132e21; color:#68d391; display:block; } .d-del { background:#33181b; color:#fc8181; display:block; }
  .d-hunk { color:#63b3ed; font-weight:bold; display:block; } .d-file { color:#f6e05e; font-weight:bold; display:block; }
</style>
</head>
<body>
<aside>
  <b>CHANNELS</b> <button style="padding:1px 6px;float:right" title="Создать канал" onclick="newChannel()">+</button>
  <hr style="border-color:#2d3748"><div id="chList"></div>
  <br><b>THREADS</b>
  <span style="float:right">
    <button style="padding:1px 6px" onclick="forkThread()">Fork</button>
    <button style="padding:1px 6px" onclick="newThread()">+</button>
  </span>
  <hr style="border-color:#2d3748"><div id="threadList"></div>
</aside>

<main>
  <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:#181b20;border-bottom:1px solid #2d3748">
    <div style="display:flex;align-items:center;gap:12px">
      <b id="headerTitle"># general / main</b>
      <span id="statusBadge" style="font-size:12px;color:#ecc94b">● connecting...</span>
    </div>
    <select id="modelSelect" style="background:#0d0f12;color:#fff;border:1px solid #2d3748;padding:4px 8px;font:inherit">
      <option value="gemini-2.5-flash">gemini-2.5-flash (fast / high quota)</option>
      <option value="gemini-2.5-pro">gemini-2.5-pro (deep reasoning)</option>
    </select>
  </div>
  <div id="log"></div>
  <div class="bar"><textarea id="prompt" placeholder="Message to thread..."></textarea><button onclick="send()">Send</button></div>
</main>
<div id="panel">
  <b>CONTEXT & MEMORY</b>
  <input id="mTitle" placeholder="Key (f.ex. nft-rules)">
  <textarea id="mText" style="flex:none;height:60px" placeholder="Text or short..."></textarea>
  <div style="display:flex;gap:6px"><button onclick="saveMem(true)">Pin Raw</button><button onclick="saveMem(false)">Distill Learn</button></div>
  <hr style="border-color:#2d3748;width:100%">
  <b>DIFF INSPECTOR & DEPLOY</b>
  <input id="dNode" placeholder="Node gRPC URL (ex. http://192.168.200.10:8443)" onchange="localStorage.dNode=this.value">
  <input id="dRepo" placeholder="Target workspace (ex. /srv/projects/app)" onchange="localStorage.dRepo=this.value">
  <input id="dPipe" placeholder="Pipeline name (from node's local.yaml)" onchange="localStorage.dPipe=this.value">
  <div style="display:flex;justify-content:space-between"><span id="diffStats">No diff</span><button onclick="pasteDiff()">Paste</button></div>
  <div id="diffView">Awaiting diff...</div>
  <button id="btnApprove" style="background:#2f855a" disabled onclick="approveTask()">Approve & Execute</button>
</div>
<script>
let ch = 'general', thread = 'main', currentDiff = '';
async function setCh(el, c) {
  ch = c; thread = 'main';
  if (el) { document.querySelectorAll('#chList .item').forEach(d => d.classList.remove('active')); el.classList.add('active'); }
  await refreshThreads(); await loadHistory();
}
async function refreshThreads() {
  const list = await (await fetch(`/api/threads?channel=${encodeURIComponent(ch)}`)).json();
  threadList.innerHTML = '';
  list.forEach(t => {
    const d = document.createElement('div'); d.className = 'item' + (t === thread ? ' active' : ''); d.textContent = `↳ ${t}`;
    d.onclick = () => { thread = t; refreshThreads(); loadHistory(); }; threadList.appendChild(d);
  });
}
async function newThread() {
  const n = window.prompt('Thread name:'); if (!n) return;
  thread = n.trim().replace(/\s+/g, '-'); await refreshThreads(); log.innerHTML = '';
}
async function loadHistory() {
  headerTitle.textContent = `# ${ch} / ${thread}`;
  log.innerHTML = '';
  const msgs = await (await fetch(`/api/history?channel=${encodeURIComponent(ch)}&thread=${encodeURIComponent(thread)}`)).json();
  msgs.forEach(m => appendBubble(m.role, m.text));
}
function appendBubble(who, txt) {
  const box = document.createElement('div'); box.className = 'msg';
  const body = document.createElement('div'); body.textContent = `[${who}]\n${txt}`; box.appendChild(body);
  const m = txt.match(/```diff\n([\s\(\S\)]*?)```/);
  if (m) { const b = document.createElement('button'); b.style.marginTop='6px'; b.textContent='Inspect Diff ->'; b.onclick=()=>loadDiff(m[1]); box.appendChild(b); }
  log.appendChild(box); log.scrollTop = log.scrollHeight;
}
function loadDiff(raw) {
  currentDiff = raw; diffView.innerHTML = ''; let a = 0, d = 0;
  raw.split('\n').forEach(l => {
    const s = document.createElement('span'); s.textContent = l || ' ';
    if (l.startsWith('+++')||l.startsWith('---')) s.className='d-file';
    else if (l.startsWith('@@')) s.className='d-hunk';
    else if (l.startsWith('+')) { s.className='d-add'; a++; } else if (l.startsWith('-')) { s.className='d-del'; d++; }
    diffView.appendChild(s);
  });
  diffStats.textContent = `+${a} / -${d}`; btnApprove.disabled = false;
}
function pasteDiff() { const r = window.prompt('Unified diff:'); if (r) loadDiff(r); }
async function send() {
  const p = prompt.value.trim(); if (!p) return; prompt.value = ''; appendBubble('user', p);
  const d = await (await fetch('/api/chat', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ channel: ch, thread, prompt: p, model: modelSelect.value })
  })).json();
  appendBubble(modelSelect.value, d.reply || 'error'); await refreshThreads();
}
async function saveMem(pin) {
  await fetch('/api/memory/learn', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({channel:ch, title:mTitle.value, text:mText.value, pin}) });
  appendBubble('system', pin ? 'Pinned' : 'Learned');
}
async function approveTask() {
  btnApprove.disabled = true;
  const r = await (await fetch('/api/task/approve', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({node_grpc_url:dNode.value, target_repo:dRepo.value, deploy_pipeline:dPipe.value, unified_diff:currentDiff}) })).json();
  appendBubble('deploy', JSON.stringify(r, null, 2));
}
async function forkThread() {
  const dst = window.prompt(`Clone thread "${thread}" into new:`);
  if (!dst) return;
  const spec = window.prompt('How many messages to clone? Format: <first>,<last> (f.ex. 2,6 or 0,10):', '2,6');
  if (!spec) return;
  const [h, t] = spec.split(',').map(x => parseInt(x.trim(), 10) || 0);
  const cleanDst = dst.trim().replace(/\s+/g, '-');

  const res = await (await fetch('/api/threads/fork', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ channel: ch, src_thread: thread, dst_thread: cleanDst, keep_head: h, keep_tail: t })
  })).json();

  thread = cleanDst;
  await refreshThreads();
  await loadHistory();
  appendBubble('system', `Forked from "${thread}": moved ${res.copied} messages (head=${h}, tail=${t}).`);
}
async function refreshChannels() {
  const list = await (await fetch('/api/channels')).json();
  if (!list.includes(ch)) list.push(ch);
  chList.innerHTML = '';
  list.forEach(c => {
    const d = document.createElement('div');
    d.className = 'item' + (c === ch ? ' active' : '');
    d.textContent = `# ${c}`;
    d.onclick = () => setCh(c);
    chList.appendChild(d);
  });
}

async function newChannel() {
  const n = window.prompt('New channel / project:');
  if (!n) return;
  await setCh(n.trim().replace(/\s+/g, '-'));
}

async function setCh(c) {
  ch = c; thread = 'main';
  await refreshChannels();
  await refreshThreads();
  await refreshMemory();
  await loadHistory();
}
window.onload = async () => {
  dNode.value = localStorage.dNode || '';
  dRepo.value = localStorage.dRepo || '';
  dPipe.value = localStorage.dPipe || '';
  const cfg = await (await fetch('/api/config')).json();
  if (cfg.default_model) modelSelect.value = cfg.default_model;
  await setCh('general');
};

const spinFrames = ['⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏'];
let spinIdx = 0, lastDone = -1;

setInterval(async () => {
  try {
    const s = await (await fetch('/api/status')).json();
    if (s.busy) {
      const f = spinFrames[spinIdx++ % spinFrames.length];
      statusBadge.style.color = '#ecc94b';
      statusBadge.textContent = `${f} indexing ${s.done_repos}/${s.total_repos}: ${s.current_repo} (${s.indexed_files} files)`;
      if (s.done_repos !== lastDone) { lastDone = s.done_repos; await refreshChannels(); }
    } else {
      statusBadge.style.color = '#68d391';
      statusBadge.textContent = `● ready (${s.total_repos} repos)`;
      if (lastDone !== -2) { lastDone = -2; await refreshChannels(); }
    }
  } catch {
    statusBadge.style.color = '#fc8181';
    statusBadge.textContent = '● offline / reconnecting...';
  }
}, 2000);
</script>
</body></html>
