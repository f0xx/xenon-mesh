# Overlay fragment. Merged on top of /etc/xmeshd/cluster.yaml.
# Do not load this file by itself; it does not repeat required sections.
models:
  default: ""
  providers:
    - id: local
      host: local
      kind: openai
      base_url: "http://127.0.0.1:11434/v1"
      discover: true
      coding_bias: true

deploy_pipelines:
  reload-rules:
    workdir: "/srv/projects/app"
    command: ["/usr/local/libexec/nft-apply.sh"]
    use_bwrap: false
    allow_network: false
