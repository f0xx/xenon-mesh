# Node example. Copy to /etc/xmeshd/local.yaml on a machine that joins a hub.
# schema v1. node.id is required and is the name shown on this machine's messages.
schema: 1
node:
  id: "node-a"
  mode: "node"
  listen_addr: "0.0.0.0:8443"
  http_addr: "0.0.0.0:8080"
  master_url: "http://hub.example:8443"
  hmac_secret_path: "/etc/xmeshd/hmac.key"
  allowed_workspaces:
    - "/srv/projects"

storage:
  primary_url: null
  fallback_sqlite: "/var/lib/xmeshd/cache.db"

models:
  default: ""
  providers:
    - id: local
      kind: auto
      base_url: "http://127.0.0.1:11434/v1"
      discover: true
      coding_bias: true
      timeout_secs: 300

git:
  bare_repos_root: null
  watched_repos: []

deploy_pipelines:
  run-cargo-test:
    workdir: "/srv/projects/app"
    command: ["cargo", "test", "--offline"]
    use_bwrap: true
    allow_network: false
